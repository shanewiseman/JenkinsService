apiVersion: ci.jenkinsservice.dev/v1
runtime:
  image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  timeoutMinutes: 20
  cpu: 2
  memory: 2Gi
  pids: 512
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
steps:
  standards:
    - id: lint
      command: ["python", "-m", "ruff", "check", "."]
  tests:
    - id: unit
      command: ["python", "-m", "pytest", "--junitxml=reports/junit.xml"]
      reports:
        - type: junit
          path: reports/junit.xml
  custom: []
artifacts:
  - name: reports
    path: reports/**
    required: true
extensions: []
