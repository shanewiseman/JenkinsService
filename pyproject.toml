[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "jenkins-service"
version = "0.1.0"
description = "A curated Jenkins REST and MCP control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "JenkinsService maintainers" }]
dependencies = [
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jsonschema==4.25.0",
  "mcp==1.12.3",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[project.scripts]
jenkins-service = "jenkins_service.app:run"
jenkins-service-contract = "jenkins_service.contract:main"
jenkins-service-extension-runner = "jenkins_service.extension_runner:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jenkins_service"]

[tool.hatch.build.targets.wheel.force-include]
"examples/pipeline.yaml" = "jenkins_service/examples/pipeline.yaml"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/jenkins_service/app.py" = ["S104"]
"src/jenkins_service/extension_runner.py" = ["S104"]
"src/jenkins_service/webhook.py" = ["S106"]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
disable_error_code = ["import-untyped"]
warn_return_any = false
warn_unused_ignores = false
packages = ["jenkins_service"]
