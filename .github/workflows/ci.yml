name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --requirement requirements-dev.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=jenkins_service --cov-report=xml
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  compose:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: https://ci.example.invalid
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: mkdir -p secrets && touch secrets/{postgres_password,jenkins_admin_password,jenkins_api_token,api_tokens,github_read_pat,github_write_pat,github_webhook_secret}
      - run: docker compose config --quiet
