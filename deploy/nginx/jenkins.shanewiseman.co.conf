# Install this file as /etc/nginx/sites-available/jenkins.shanewiseman.co
# after obtaining the certificate described in docs/server-deployment.md.
#
# This map is valid when sites-enabled/* is included from nginx.conf's http
# context, as it is on Debian and Ubuntu.
map $http_upgrade $jenkinsservice_connection_upgrade {
    default upgrade;
    ""      close;
}

upstream jenkinsservice_controller {
    server 127.0.0.1:18080;
    keepalive 16;
}

upstream jenkinsservice_gateway {
    server 127.0.0.1:18000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name jenkins.shanewiseman.co;

    return 301 https://jenkins.shanewiseman.co$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.shanewiseman.co;

    ssl_certificate /etc/letsencrypt/live/jenkins.shanewiseman.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.shanewiseman.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Request-ID $request_id always;

    location = /jenkins {
        return 301 /jenkins/;
    }

    # The proxy_pass has no URI suffix. Nginx therefore preserves /jenkins/
    # instead of stripping it before forwarding to the prefixed controller.
    location ^~ /jenkins/ {
        proxy_pass http://jenkinsservice_controller;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkinsservice_connection_upgrade;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }

    # The gateway owns the REST API, MCP stream, GitHub webhook, callbacks,
    # health endpoints, and the root service endpoint.
    location / {
        proxy_pass http://jenkinsservice_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jenkinsservice_connection_upgrade;

        # Stream MCP/SSE and progressive responses immediately. Disabling
        # request buffering also lets the gateway enforce webhook body limits
        # while the request arrives.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }
}
