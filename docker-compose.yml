name: jenkins-service

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  docker:
    image: docker:29.6.2-dind@sha256:bfec1f5159c63a81ca6fdedbd81404d2c0e16378ed0feec3bb3fbf3998847659
    privileged: true
    command:
      - --host=tcp://0.0.0.0:2376
      - --host=unix:///var/run/docker.sock
      - --storage-driver=overlay2
      - --log-level=warn
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
      - docker-data:/var/lib/docker
      - agent-workspace:/home/jenkins/agent
    networks:
      control:
        aliases: [docker]
      egress: {}
    labels:
      - "traefik.enable=false"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          docker --host tcp://localhost:2376
          --tlsverify --tlscacert /certs/client/ca.pem
          --tlscert /certs/client/cert.pem
          --tlskey /certs/client/key.pem info
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: docker/jenkins/Dockerfile
    image: jenkinsservice-controller:0.1.0
    depends_on:
      docker:
        condition: service_healthy
    environment:
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.model.DirectoryBrowserSupport.CSP=sandbox
      JENKINS_OPTS: --prefix=/jenkins
      JENKINS_ADMIN_USER: admin
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL:?JENKINS_PUBLIC_URL is required}
      JENKINS_AGENT_EXECUTORS: ${JENKINS_AGENT_EXECUTORS:-4}
    secrets:
      - jenkins_admin_password
      - jenkins_api_token
      - github_read_pat
    volumes:
      - jenkins-data:/var/jenkins_home
    ports:
      - "127.0.0.1:${JENKINS_PORT:-18080}:8080"
    networks:
      control: {}
      egress: {}
      dmz: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DMZ_NETWORK:-dmz_internal}"
      - "traefik.http.routers.jenkinsservice-jenkins.rule=Host(`${JENKINS_HOST:?Set JENKINS_HOST to the public hostname}`) && (Path(`/jenkins`) || PathPrefix(`/jenkins/`))"
      - "traefik.http.routers.jenkinsservice-jenkins.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.jenkinsservice-jenkins.tls=true"
      - "traefik.http.routers.jenkinsservice-jenkins.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.routers.jenkinsservice-jenkins.priority=200"
      - "traefik.http.routers.jenkinsservice-jenkins.service=jenkinsservice-jenkins"
      - "traefik.http.routers.jenkinsservice-jenkins.middlewares=jenkinsservice-jenkins-slash"
      - "traefik.http.middlewares.jenkinsservice-jenkins-slash.redirectregex.regex=^https?://([^/]+)/jenkins$"
      - "traefik.http.middlewares.jenkinsservice-jenkins-slash.redirectregex.replacement=https://$${1}/jenkins/"
      - "traefik.http.middlewares.jenkinsservice-jenkins-slash.redirectregex.permanent=true"
      - "traefik.http.services.jenkinsservice-jenkins.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --location http://localhost:8080/jenkins/login >/dev/null
      interval: 15s
      timeout: 5s
      retries: 30
    logging: *default-logging
    restart: unless-stopped

  orchestrator:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    image: jenkinsservice-agent:0.1.0
    depends_on:
      docker:
        condition: service_healthy
      jenkins:
        condition: service_healthy
    environment:
      JENKINS_URL: http://jenkins:8080/jenkins/
      JENKINS_AGENT_NAME: orchestrator
      JENKINS_WEB_SOCKET: "true"
      BUILD_CALLBACK_URL: http://gateway:8000/internal/build-completions
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - jenkins_api_token
      - build_callback_secret
    volumes:
      - docker-certs-client:/certs/client:ro
      - agent-workspace:/home/jenkins/agent
    networks:
      control: {}
      egress: {}
    labels:
      - "traefik.enable=false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
    environment:
      POSTGRES_DB: jenkinsservice
      POSTGRES_USER: jenkinsservice
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    networks:
      database: {}
    labels:
      - "traefik.enable=false"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U jenkinsservice -d jenkinsservice
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    restart: unless-stopped

  extension-runner:
    build:
      context: .
      dockerfile: docker/extension-runner/Dockerfile
    image: jenkinsservice-extension-runner:0.1.0
    depends_on:
      docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      EXTENSION_ALLOWLIST: ${EXTENSION_ALLOWLIST:-}
      EXTENSION_CATALOG_PATH: /app/extensions
    volumes:
      - docker-certs-client:/certs/client:ro
    networks:
      control: {}
    labels:
      - "traefik.enable=false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8090/healthz')
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

  review-broker:
    build:
      context: .
      dockerfile: docker/review-broker/Dockerfile
    image: jenkinsservice-review-broker:0.1.0
    environment:
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-medium}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-4096}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-3}
      OPENAI_RETRY_BASE_SECONDS: ${OPENAI_RETRY_BASE_SECONDS:-0.25}
      REVIEW_PROMPT_VERSION: ${REVIEW_PROMPT_VERSION:-v1}
      REVIEW_MAX_DIFF_BYTES: ${REVIEW_MAX_DIFF_BYTES:-250000}
      REVIEW_MAX_CONTEXT_BYTES: ${REVIEW_MAX_CONTEXT_BYTES:-50000}
      REVIEW_MAX_OUTPUT_BYTES: ${REVIEW_MAX_OUTPUT_BYTES:-64000}
    secrets:
      - openai_api_key
      - review_broker_token
    networks:
      control: {}
      egress: {}
    labels:
      - "traefik.enable=false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8100/healthz')
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: jenkinsservice-gateway:0.1.0
    depends_on:
      postgres:
        condition: service_healthy
      jenkins:
        condition: service_healthy
      extension-runner:
        condition: service_healthy
      review-broker:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://jenkinsservice@postgres:5432/jenkinsservice
      JENKINS_URL: http://jenkins:8080/jenkins/
      EXTENSION_RUNNER_URL: http://extension-runner:8090
      REVIEW_BROKER_URL: http://review-broker:8100
    secrets:
      - postgres_password
      - jenkins_api_token
      - api_tokens
      - github_write_pat
      - github_webhook_secret
      - build_callback_secret
      - review_broker_token
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    networks:
      control: {}
      database: {}
      egress: {}
      dmz: {}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${DMZ_NETWORK:-dmz_internal}"
      - "traefik.http.routers.jenkinsservice-gateway.rule=Host(`${JENKINS_HOST:?Set JENKINS_HOST to the public hostname}`)"
      - "traefik.http.routers.jenkinsservice-gateway.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.jenkinsservice-gateway.tls=true"
      - "traefik.http.routers.jenkinsservice-gateway.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-myresolver}"
      - "traefik.http.routers.jenkinsservice-gateway.priority=1"
      - "traefik.http.routers.jenkinsservice-gateway.service=jenkinsservice-gateway"
      - "traefik.http.services.jenkinsservice-gateway.loadbalancer.server.port=8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/readyz')
      interval: 10s
      timeout: 5s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    logging: *default-logging
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  jenkins_admin_password:
    file: ./secrets/jenkins_admin_password
  jenkins_api_token:
    file: ./secrets/jenkins_api_token
  api_tokens:
    file: ./secrets/api_tokens
  github_read_pat:
    file: ./secrets/github_read_pat
  github_write_pat:
    file: ./secrets/github_write_pat
  github_webhook_secret:
    file: ./secrets/github_webhook_secret
  build_callback_secret:
    file: ./secrets/build_callback_secret
  review_broker_token:
    file: ./secrets/review_broker_token
  openai_api_key:
    file: ./secrets/openai_api_key

volumes:
  docker-certs-ca:
  docker-certs-client:
  docker-data:
  agent-workspace:
  jenkins-data:
  postgres-data:

networks:
  control:
    internal: true
  database:
    internal: true
  egress:
  dmz:
    external: true
    name: ${DMZ_NETWORK:-dmz_internal}
